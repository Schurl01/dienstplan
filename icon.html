<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>App-Icon</title>
<!-- Wird beim Build mit Chrome (headless) als PNG fotografiert: icon.html#180 und icon.html#512 -->
<style>html, body { margin: 0; background: #060b16; overflow: hidden; } canvas { display: block; }</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
var S = parseInt(location.hash.slice(1), 10) || 180;
var c = document.getElementById('c'); c.width = c.height = S; c.style.width = c.style.height = S + 'px';
var x = c.getContext('2d'); x.scale(S / 180, S / 180);
// Nachthimmel
var g = x.createLinearGradient(0, 0, 180, 180);
g.addColorStop(0, '#22345a'); g.addColorStop(0.55, '#0e1830'); g.addColorStop(1, '#060b16');
x.fillStyle = g; x.fillRect(0, 0, 180, 180);
var gl = x.createRadialGradient(40, 150, 0, 40, 150, 120);
gl.addColorStop(0, 'rgba(210,177,124,0.28)'); gl.addColorStop(1, 'rgba(210,177,124,0)');
x.fillStyle = gl; x.fillRect(0, 0, 180, 180);
// Sterne
[[30, 30, 1.3], [62, 18, 0.9], [150, 24, 1.1], [120, 66, 0.8], [24, 80, 0.9], [160, 98, 1.2], [95, 34, 0.7], [140, 140, 0.8]].forEach(function (s) {
  x.fillStyle = 'rgba(236,228,212,0.75)'; x.beginPath(); x.arc(s[0], s[1], s[2], 0, 6.283); x.fill();
});
// Kondensstreifen
var P0 = [14, 164], P1 = [74, 152], P2 = [118, 72];
function pt(t) { var a = 1 - t; return [a * a * P0[0] + 2 * a * t * P1[0] + t * t * P2[0], a * a * P0[1] + 2 * a * t * P1[1] + t * t * P2[1]]; }
x.lineCap = 'round';
for (var i = 1; i <= 60; i++) {
  var a = pt((i - 1) / 60), b = pt(i / 60);
  x.strokeStyle = 'rgba(232,201,146,' + (0.9 * i / 60) + ')'; x.lineWidth = 1 + 5 * (i / 60);
  x.beginPath(); x.moveTo(a[0], a[1]); x.lineTo(b[0], b[1]); x.stroke();
}
// Flugzeug: Heck sitzt am Ende des Streifens
var q = pt(0.99), p = pt(1), ang = Math.atan2(p[1] - q[1], p[0] - q[0]);
var size = 74, back = size * 0.36;
var plane = new Path2D('M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z');
x.save(); x.translate(p[0] + Math.cos(ang) * back, p[1] + Math.sin(ang) * back); x.rotate(ang + Math.PI / 2);
x.scale(size / 24, size / 24); x.translate(-12, -12);
x.shadowColor = 'rgba(232,201,146,0.8)'; x.shadowBlur = 10;
var pg = x.createLinearGradient(0, 0, 24, 24); pg.addColorStop(0, '#f6dfae'); pg.addColorStop(1, '#c79a55');
x.fillStyle = pg; x.fill(plane); x.restore();
</script>
</body>
</html>
