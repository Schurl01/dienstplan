name: Flugstatus

on:
  schedule:
    - cron: '*/10 * * * *'   # alle 10 Minuten (fragt nur rund um Fluege bei AeroDataBox nach)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: flugstatus
  cancel-in-progress: false

jobs:
  status:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Status abfragen
        shell: pwsh
        env:
          ICS_URL: ${{ secrets.ICS_URL }}
          PAGE_PASSWORD: ${{ secrets.PAGE_PASSWORD }}
          AERODATABOX_KEY: ${{ secrets.AERODATABOX_KEY }}
        run: ./status-github.ps1

      - name: Status speichern
        run: |
          if [ -f status.enc ]; then
            git add status.enc
            if ! git diff --cached --quiet; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git commit -m "Flugstatus aktualisiert"
              git pull --rebase --autostash || true
              git push
            fi
          fi
